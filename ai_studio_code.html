<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yoko Telegram Bot — Vercel</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
      .box { max-width: 520px; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #475569; line-height: 1.5; margin: 0 0 16px; }
      button { background: #0284c7; color: #fff; border: none; border-radius: 8px; padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
      button:hover { background: #0369a1; }
      pre { margin: 16px 0 0; padding: 12px; background: #0f172a; color: #f8fafc; border-radius: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Yoko Telegram Bot (Vercel 24/7)</h1>
      <p>
        Добавьте переменную <code>TELEGRAM_BOT_TOKEN</code> в настройках Vercel (Settings → Environment Variables), затем нажмите кнопку ниже для подключения Webhook, команд и кнопки «Приложение Йоко Магазин».
      </p>
      <button id="btn" onclick="setup()">Подключить бота к Telegram</button>
      <pre id="out">Ожидание подключения...</pre>
    </div>
    <script>
      async function setup() {
        const out = document.getElementById('out');
        const btn = document.getElementById('btn');
        btn.disabled = true;
        out.textContent = 'Подключение к Telegram API...';
        try {
          const res = await fetch('/api/setup');
          const data = await res.json();
          out.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          out.textContent = 'Ошибка: ' + e.message;
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
